[package]
name = "samples"
version = "0.1.0"
edition = "2024"

[dependencies]
cellular_automata = { path = "../cellular_automata" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
